# AI Notes and Scheduling — full stack (Docker alternative for offline deploy).
# See offline/README.md for the offline save/load procedure.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: udaan_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0085"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d udaan_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: udaan_db
      DB_USER: postgres
      DB_PASSWORD: "0085"
      # Voice transcription on CPU (this box has no GPU). A small English model so
      # short notes transcribe in seconds; first use downloads it (~150 MB) and
      # then it is cached. Swap to small.en for more accuracy at lower speed.
      WHISPER_DEVICE: "cpu"
      WHISPER_COMPUTE_TYPE: "int8"
      WHISPER_MODEL: "base.en"
      # Text LLM for extraction (voice→event, Notes "Find tasks", Tasks "Parse").
      # Points at the local Ollama service below. Small model = CPU-usable but
      # slow (~30-60s/call, no GPU). Note: scanned-image extraction still needs a
      # vision model + GPU; this text model only serves the text features.
      LLM_BASE_URL: "http://ollama:11434/v1"
      LLM_MODEL: "qwen2.5:3b"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "9000:9000"

  # Local text-LLM server (OpenAI-compatible API at /v1). CPU-only here.
  # After `docker compose up`, pull the model once:
  #   docker compose exec ollama ollama pull qwen2.5:3b
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  ollama:
